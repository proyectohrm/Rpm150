<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="manifest.json">
  <title>RPM Moto 150</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { margin: 0; background:#111; color:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .card { width:min(92vw,520px); padding:24px; box-sizing:border-box; }
    h1 { margin:0 0 8px; font-size:1.6rem; }
    .sub { opacity:.75; margin-bottom:22px; }
    .rpm { font-size:4.8rem; font-weight:700; line-height:1; margin:18px 0 4px; }
    .unit { opacity:.7; margin-bottom:18px; }
    .bar { height:16px; background:#333; border-radius:999px; overflow:hidden; margin:18px 0; }
    .fill { height:100%; width:0%; background:#fff; transition:width .08s linear; }
    button { width:100%; border:0; border-radius:14px; padding:16px; font-size:1.1rem; font-weight:650; margin-top:12px; }
    #start { background:#fff; color:#111; }
    #stop { background:#333; color:#fff; }
    .row { display:flex; gap:10px; }
    .row button { width:50%; }
    .info { margin-top:18px; padding:14px; background:#1d1d1d; border-radius:12px; font-size:.95rem; line-height:1.4; }
    .ok { opacity:.9; }
    .small { opacity:.65; font-size:.88rem; margin-top:10px; }
    select { width:100%; padding:12px; border-radius:10px; margin-top:8px; background:#222; color:#fff; border:1px solid #444; }
  </style>
</head>
<body>
  <main class="card">
    <h1>RPM Moto 150</h1>
    <div class="sub">Estimación por micrófono · monocilíndrica 4T</div>

    <div id="rpm" class="rpm">0</div>
    <div class="unit">RPM</div>
    <div class="bar"><div id="fill" class="fill"></div></div>

    <label for="mode">Modo de pulsos</label>
    <select id="mode">
      <option value="1">1 pulso por vuelta (probar primero)</option>
      <option value="0.5">1 pulso cada 2 vueltas</option>
    </select>

    <div class="row">
      <button id="start">Iniciar</button>
      <button id="stop" disabled>Detener</button>
    </div>

    <div class="info">
      <div id="status" class="ok">Micrófono detenido.</div>
      <div id="quality" class="small">Calidad de señal: —</div>
      <div class="small">Poné el teléfono cerca del motor, pero lejos del escape. Para la primera prueba hacela sin reproducir el sonido de 600.</div>
    </div>
  </main>

<script>
let audioCtx, stream, source, analyser, timer;
let smoothedRPM = 0;
const rpmEl = document.getElementById('rpm');
const fillEl = document.getElementById('fill');
const statusEl = document.getElementById('status');
const qualityEl = document.getElementById('quality');
const startBtn = document.getElementById('start');
const stopBtn = document.getElementById('stop');
const modeSel = document.getElementById('mode');

function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }

function autocorrelate(buf, sampleRate) {
  let SIZE = buf.length;
  let rms = 0;
  for (let i=0;i<SIZE;i++) rms += buf[i]*buf[i];
  rms = Math.sqrt(rms/SIZE);
  if (rms < 0.015) return {freq:-1, quality:0, rms};

  // DC removal
  let mean = 0;
  for (let i=0;i<SIZE;i++) mean += buf[i];
  mean /= SIZE;
  for (let i=0;i<SIZE;i++) buf[i] -= mean;

  // Motor 150: buscamos fundamental aproximada entre 15 y 170 Hz
  const minFreq = 15;
  const maxFreq = 170;
  const minLag = Math.floor(sampleRate/maxFreq);
  const maxLag = Math.min(Math.floor(sampleRate/minFreq), SIZE-2);

  let bestLag = -1, best = -Infinity;
  let energy = 0;
  for (let i=0;i<SIZE;i++) energy += buf[i]*buf[i];

  for (let lag=minLag; lag<=maxLag; lag++) {
    let sum = 0;
    for (let i=0;i<SIZE-lag;i++) sum += buf[i]*buf[i+lag];
    let corr = sum / (energy || 1);
    if (corr > best) { best = corr; bestLag = lag; }
  }

  if (bestLag < 0 || best < 0.08) return {freq:-1, quality:clamp(best,0,1), rms};
  return {freq: sampleRate/bestLag, quality:clamp(best*3,0,1), rms};
}

async function start() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,
        channelCount: 1
      }
    });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 8192;
    analyser.smoothingTimeConstant = 0;
    source.connect(analyser);

    const buf = new Float32Array(analyser.fftSize);
    statusEl.textContent = "Escuchando el motor…";
    startBtn.disabled = true;
    stopBtn.disabled = false;

    timer = setInterval(() => {
      analyser.getFloatTimeDomainData(buf);
      const work = new Float32Array(buf);
      const r = autocorrelate(work, audioCtx.sampleRate);

      let rpm = 0;
      if (r.freq > 0) {
        const pulsesPerRev = parseFloat(modeSel.value);
        rpm = (r.freq * 60) / pulsesPerRev;
        if (rpm < 600 || rpm > 12000) rpm = 0;
      }

      if (rpm > 0) {
        smoothedRPM = smoothedRPM ? (smoothedRPM*0.78 + rpm*0.22) : rpm;
      } else {
        smoothedRPM *= 0.82;
        if (smoothedRPM < 300) smoothedRPM = 0;
      }

      const shown = Math.round(smoothedRPM/10)*10;
      rpmEl.textContent = shown.toLocaleString('es-AR');
      fillEl.style.width = clamp(shown/10000*100,0,100) + "%";
      qualityEl.textContent = "Calidad de señal: " + Math.round(r.quality*100) + "%";
    }, 120);
  } catch (e) {
    statusEl.textContent = "No pude acceder al micrófono: " + e.message;
  }
}

function stop() {
  if (timer) clearInterval(timer);
  if (stream) stream.getTracks().forEach(t=>t.stop());
  if (audioCtx) audioCtx.close();
  timer = null; stream = null; audioCtx = null;
  smoothedRPM = 0;
  rpmEl.textContent = "0";
  fillEl.style.width = "0%";
  statusEl.textContent = "Micrófono detenido.";
  qualityEl.textContent = "Calidad de señal: —";
  startBtn.disabled = false;
  stopBtn.disabled = true;
}

startBtn.addEventListener('click', start);
stopBtn.addEventListener('click', stop);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
</html>
